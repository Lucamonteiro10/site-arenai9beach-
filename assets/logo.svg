<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Silver Gradients -->
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#D1D5DB" />
      <stop offset="50%" stop-color="#9CA3AF" />
      <stop offset="75%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>

    <linearGradient id="metalBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="30%" stop-color="#9CA3AF" />
      <stop offset="70%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>

    <!-- Deep Royal Blue Gradients -->
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2F5E" />
      <stop offset="40%" stop-color="#0A1D3A" />
      <stop offset="100%" stop-color="#050E1D" />
    </linearGradient>

    <!-- Vibrant Yellow Sport Glow -->
    <linearGradient id="yellowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="50%" stop-color="#FFC700" />
      <stop offset="100%" stop-color="#E6A800" />
    </linearGradient>

    <!-- Chrome Sphere Radial Gradient for Ball -->
    <radialGradient id="chromeSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="80%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="yellowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFC700" flood-opacity="0.6"/>
    </filter>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Shield Shadow & Base -->
  <g filter="url(#shieldShadow)">
    <!-- Outer Metallic Rim -->
    <path d="M 250,20 L 420,70 C 420,240 370,390 250,470 C 130,390 80,240 80,70 Z" 
          fill="url(#metalBorder)" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Yellow Sport Accent Rim -->
    <path d="M 250,30 L 408,76 C 408,235 360,380 250,458 C 140,380 92,235 92,76 Z" 
          fill="none" stroke="url(#yellowGlow)" stroke-width="4" filter="url(#yellowFilter)" />

    <!-- Inner Shield Body (Navy Deep Blue) -->
    <path d="M 250,38 L 398,82 C 398,230 352,370 250,446 C 148,370 102,230 102,82 Z" 
          fill="url(#shieldBlue)" />
  </g>

  <!-- Background Lines / Ray Effects on Shield -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="250" y1="50" x2="120" y2="200" />
    <line x1="250" y1="50" x2="380" y2="200" />
    <line x1="250" y1="50" x2="150" y2="350" />
    <line x1="250" y1="50" x2="350" y2="350" />
    <line x1="250" y1="50" x2="250" y2="440" />
  </g>

  <!-- Upper Banner Text: ARENA -->
  <path d="M 130,118 Q 250,132 370,118" fill="none" id="textPathTop" />
  <text font-family="'Montserrat', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="8">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      ARENA
    </textPath>
  </text>

  <!-- CENTRAL METALLIC BALL (A Bola Central Metálica) -->
  <g transform="translate(250, 245)">
    <!-- Ball Drop Shadow -->
    <ellipse cx="0" cy="85" rx="75" ry="16" fill="#000000" opacity="0.6" filter="blur(6px)" />

    <!-- Outer Chrome Ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="url(#metalSilver)" stroke-width="6" />
    <circle cx="0" cy="0" r="79" fill="none" stroke="url(#yellowGlow)" stroke-width="2.5" />

    <!-- 3D Chrome Ball Sphere -->
    <circle cx="0" cy="0" r="76" fill="url(#chromeSphere)" />

    <!-- Ball Seams / Geometric Sport Panels (Futebol / Beach Tennis Hybrid) -->
    <!-- Curved sports seams -->
    <path d="M -70, -25 C -30, -10 30, -10 70, -25" fill="none" stroke="url(#metalSilver)" stroke-width="3" opacity="0.8" />
    <path d="M -70, 25 C -30, 10 30, 10 70, 25" fill="none" stroke="url(#metalSilver)" stroke-width="3" opacity="0.8" />
    <path d="M -25, -70 C -10, -30 -10, 30 -25, 70" fill="none" stroke="url(#metalSilver)" stroke-width="3" opacity="0.8" />
    <path d="M 25, -70 C 10, -30 10, 30 25, 70" fill="none" stroke="url(#metalSilver)" stroke-width="3" opacity="0.8" />

    <!-- Central Pentagonal Chrome Plaque with "i9" -->
    <polygon points="0,-42 40,-13 25,35 -25,35 -40,-13" fill="#0A192F" stroke="url(#yellowGlow)" stroke-width="3.5" />
    
    <!-- "i9" Monogram inside ball -->
    <!-- "i" in Yellow -->
    <text x="-12" y="14" font-family="'Impact', 'Montserrat', sans-serif" font-size="44" font-weight="900" fill="#FFE600" text-anchor="middle">i</text>
    <!-- "9" in Chrome White with glow -->
    <text x="12" y="16" font-family="'Impact', 'Montserrat', sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" text-anchor="middle">9</text>

    <!-- Glossy Highlight on Ball -->
    <ellipse cx="-25" cy="-35" rx="30" ry="16" transform="rotate(-30, -25, -35)" fill="#FFFFFF" opacity="0.45" />
  </g>

  <!-- Lower Banner Ribbon / Plate: BEACH -->
  <g transform="translate(250, 395)">
    <!-- Metallic ribbon backplate -->
    <path d="M -110,-18 L 110,-18 L 95,22 L -95,22 Z" fill="#0A1D3A" stroke="url(#metalSilver)" stroke-width="2.5" />
    <!-- Yellow accent underline -->
    <line x1="-80" y1="20" x2="80" y2="20" stroke="url(#yellowGlow)" stroke-width="3" />
    <!-- Text: BEACH -->
    <text x="0" y="8" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#FFE600" letter-spacing="10" text-anchor="middle">
      BEACH
    </text>
  </g>

  <!-- Stars / Sport Accents -->
  <polygon points="250,56 254,66 265,66 256,73 259,83 250,77 241,83 244,73 235,66 246,66" fill="#FFE600" />
</svg>
